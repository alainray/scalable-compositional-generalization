model:
  arch: resnet18
  pretrained: False
  emb_dim: 512
  maxpool: 1
  out_activation: linear
  activation: relu
  # CRM: the per-attribute head must have no bias, otherwise the additive part
  # of the per-group table B_hat is unidentifiable against it.
  head_bias: False

training:
  optimizer:
    lr: 0.001

data:
  training:
    # the group softmax materialises a (batch, num_train_groups) tensor with
    # autograd; on mpi3d that is ~1.2 GB at batch 256
    batch_size: 1024
  testing:
    batch_size: 1024
