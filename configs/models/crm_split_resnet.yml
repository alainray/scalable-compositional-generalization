model:
  arch: split_resnet
  pretrained: False
  emb_dim: 512
  maxpool: 1
  out_activation: linear
  activation: relu
  split_layers: 0
  exit_reg: 10
  # SplitResNet18 reads logits straight off the raw 512-d branch features; CRM
  # needs a real per-attribute readout, without bias (see crm_resnet18.yml).
  use_task_classifiers: True
  head_bias: False

training:
  optimizer:
    lr: 0.001

data:
  training:
    batch_size: 256
  testing:
    batch_size: 1024
