model:

  arch: ed_mixer
  z_dim: &HD_DIM 512

  feature_extraction:
    arch: resnet18
    pretrained: False
    maxpool: 1
    activation: relu

  readout:
    arch: cosine_circ_conv
    codebook:
      init: FPE
      load: False
      trainable: False
      pos_delta: 0.4
      plot_similarity: False

  mixer:
    mode: algebraic
    loss_weight: 1.0
    algebraic_use_all_terms: True
    # El readout de ED clasifica con F.normalize + cosine_similarity, asi que la
    # clasificacion solo ve la direccion de cada pieza. Con el residuo crudo el
    # modelo puede anularlo encogiendo ||rep|| sin costo alguno. 'relative' divide
    # por la escala: invariante a la norma y cero solo si la representacion es
    # aditiva de verdad. Ver visgen/models/ed.py::_algebraic_loss
    algebraic_norm: relative

training:
  optimizer:
    lr: 0.001

data:
  training:
    batch_size: 2048
  testing:
    batch_size: 4096
