# Equivalente estructural de ED, sin su readout.
#
# Con split_layers: 4 cada atributo recibe su propio conv1/bn1/maxpool mas las
# cuatro etapas residuales, y shared_blocks queda vacio: una ResNet18 completa
# e independiente por atributo, que es exactamente la topologia de los
# feature_extractors de ED. La diferencia es el readout -- aqui lineal, en ED
# una convolucion circular por FFT seguida de coseno contra un codebook FPE.
#
# Eso saca del analisis la normalizacion del readout de ED (F.normalize +
# cosine_similarity, que vuelve la clasificacion invariante a ||rep|| y deja al
# termino algebraico un minimo degenerado por contraccion) y la semantica de
# fase del codebook. Ver visgen/models/modules/readouts.py y ed.py.
#
# El batch se mantiene igual al de la variante a split_layers: 0 para que la
# unica diferencia entre ambas sea la profundidad.
model:
  arch: split_resnet_mixer
  pretrained: False
  emb_dim: 512
  maxpool: 1
  out_activation: linear
  activation: relu
  split_layers: 4
  exit_reg: 10
  # CRM: no bias on the per-attribute heads, so that the per-group table B_hat
  # stays identifiable (see crm_resnet18.yml).
  head_bias: False
  mixer:
    # Analogical / parallelogram term on the split representations:
    #   ||rep_ac - rep_ad - rep_bc + rep_bd||^2
    # Requires 4-view batches, i.e. a `*_non_iid.yml` data config.
    mode: algebraic
    algebraic_use_all_terms: True
    # picked up by CRMTrainer as the weight of the auxiliary term:
    #   total = crm_group_ce + loss_weight * algebraic
    loss_weight: 1.5

training:
  optimizer:
    lr: 0.001

data:
  training:
    # 4 views per item, so the effective rows per step are 4x this
    batch_size: 256
  testing:
    batch_size: 2048
