seed: 0
path:
  base: out/
  full: ''
  model_dir_suffix: ''
logger:
  name: wandb
  project: visgen
  group: ''
training:
  trainer: base
  fp-16: True
  n_epoch: 100
  grad_accum_steps: 1
  log_steps: 10
  optimizer:
    name: 'adam'
    lr: 0.0001
    weight_decay: 0.0
  representation_metrics:
    enabled: False
    split: val_4cases
    keep_split_metrics: False
    every_n_epochs: 1
    max_samples: null
    pairwise_max_samples: null
    sampling_seed: 0
    variance_threshold: 0.9
