#          size: 64
#        - name: rand_rotation
#          degrees: 10
#          fill: 1
#        - name: gauss_blur
#          kernel_size: [ 23, 23 ]
#          sigma: 0.2
      test:
        - name: resize
          size: 64
          antialias: True
#        - name: rand_rotation
#          degrees: 10
#          fill: 1
#        - name: gauss_blur
#          kernel_size: [ 23, 23 ]
#          sigma: 0.2

  feature_extraction:
    in_channels: 3
