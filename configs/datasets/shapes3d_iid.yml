data:
  training:
    dataset: shapes3d
    path: data/shapes3d/3dshapes.h5
    targets: null
    split_attributes: null
    split: interpolation
    split_difficulty: 1
    train: true
    shuffle: true
    batch_size: 1024
    downsample: 0
    val_fraction: 0.1
    val_4cases:
      enabled: true
      replace_validation: false
      export_split: true

    num_workers: 1
    non_iid:
      name: non_iid
      seed: ${seed}
      apply_to:
      - training
      - val_4cases
      fully_iid: true
      deterministic: False
      split_overrides:
        val_4cases:
          deterministic: True
          precompute_deterministic: True
          seed: 123

    attributes: &id001
    - name: floor
      out_dim: 10
      var: 0.2
    - name: wall
      out_dim: 10
      var: 0.2
    - name: object
      out_dim: 10
      var: 0.2
    - name: scale
      out_dim: 8
      var: 0.2
    - name: shape
      out_dim: 4
      var: 0.2
    - name: orientation
      out_dim: 15
      var: 0.2
  testing:
    dataset: ${data.training.dataset}
    path: ${data.training.path}
    targets: ${data.training.targets}
    split_attributes: ${data.training.split_attributes}
    split: ${data.training.split}
    split_difficulty: ${data.training.split_difficulty}
    train: false
    shuffle: false
    batch_size: 2048
    downsample: 0
    num_workers: 1
    attributes: *id001
model:
  preprocessing:
  - arch: augmentator
    train:
    - name: resize
      size: 64
      antialias: true
    - name: gauss_blur
      kernel_size:
      - 23
      - 23
      sigma: 0.2
    test:
    - name: resize
      size: 64
      antialias: true
    - name: gauss_blur
      kernel_size:
      - 23
      - 23
      sigma: 0.2
  feature_extraction:
    in_channels: 3
