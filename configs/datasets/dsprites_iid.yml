data:
  training:
    dataset: dsprites
    path: data/dsprites/dsprites.npz
    targets: null
    split_attributes: null
    split: composition
    split_difficulty: 0.1
    train: true
    shuffle: true
    batch_size: 1024
    downsample: 0
    val_fraction: 0.1
    num_workers: 1
    non_iid:
      name: non_iid
      seed: ${seed}
      apply_to:
      - training
      fully_iid: true
      deterministic: False
      split_overrides:
        val_4cases:
          deterministic: True
          precompute_deterministic: True
          seed: 123

    attributes: &id001
    - name: shape
      out_dim: 3
      var: 1.0
    - name: scale
      out_dim: 6
      var: 0.2
    - name: orientation
      out_dim: 40
      var: 0.2
    - name: x-position
      out_dim: 32
      var: 0.2
    - name: y-position
      out_dim: 32
      var: 0.2
  testing:
    dataset: ${data.training.dataset}
    path: ${data.training.path}
    targets: ${data.training.targets}
    split_attributes: ${data.training.split_attributes}
    split: ${data.training.split}
    split_difficulty: ${data.training.split_difficulty}
    train: false
    shuffle: false
    batch_size: 2048
    downsample: 0
    num_workers: 1
    attributes: *id001
model:
  preprocessing:
  - arch: augmentator
    train:
    - name: resize
      size: 64
      antialias: true
    - name: gauss_blur
      kernel_size:
      - 23
      - 23
      sigma:
      - 0.1
      - 0.3
    test:
    - name: resize
      size: 64
      antialias: true
    - name: gauss_blur
      kernel_size:
      - 23
      - 23
      sigma:
      - 0.1
      - 0.3
  feature_extraction:
    in_channels: 1
