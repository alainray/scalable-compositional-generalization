data:
  training:
    dataset: cars3d
    path: data/cars3d
    targets: null
    split_attributes: null
    split: composition
    split_difficulty: 0.1
    train: true
    shuffle: true
    batch_size: 1024
    downsample: 0
    val_fraction: 0.1
    val_4cases:
      enabled: true
      replace_validation: false
      export_split: true

    num_workers: 1
    non_iid:
      name: non_iid
      seed: ${seed}
      apply_to:
      - training
      - val_4cases
      fully_iid: true
      deterministic: False
      split_overrides:
        val_4cases:
          deterministic: True
          precompute_deterministic: True
          seed: 123

    attributes: &id001
    - name: orientation
      out_dim: 24
      var: 0.2
    - name: elevation
      out_dim: 4
      var: 0.2
    - name: type
      out_dim: 183
      var: 1
  testing:
    dataset: ${data.training.dataset}
    path: ${data.training.path}
    targets: ${data.training.targets}
    split_attributes: ${data.training.split_attributes}
    split: ${data.training.split}
    split_difficulty: ${data.training.split_difficulty}
    train: false
    shuffle: false
    batch_size: 2048
    downsample: 0
    num_workers: 1
    attributes: *id001
training:
  n_epoch: 500
model:
  preprocessing:
  - arch: augmentator
    train:
    - name: resize
      size: 64
      antialias: true
    test:
    - name: resize
      size: 64
      antialias: true
  feature_extraction:
    in_channels: 3
